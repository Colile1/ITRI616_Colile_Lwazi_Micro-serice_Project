version: "3.9"

# Docker Compose for Secure Leave Management System
# NWU ITRI615 | Colile Sibanda

services:
  auth-service:
    build: ./auth-service
    image: leave-system/auth-service:1.0.0
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      - JWT_SECRET=${JWT_SECRET:-U2VjdXJlTGVhdmVNYW5hZ2VtZW50MjAyNCFTZWNyZXRLZXlATldV}
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - leave-network

  leave-service:
    build: ./leave-service
    image: leave-system/leave-service:1.0.0
    container_name: leave-service
    ports:
      - "8082:8082"
    environment:
      - JWT_SECRET=${JWT_SECRET:-U2VjdXJlTGVhdmVNYW5hZ2VtZW50MjAyNCFTZWNyZXRLZXlATldV}
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - leave-network

  api-gateway:
    build: ./api-gateway
    image: leave-system/api-gateway:1.0.0
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:-U2VjdXJlTGVhdmVNYW5hZ2VtZW50MjAyNCFTZWNyZXRLZXlATldV}
      - AUTH_SERVICE_URL=http://auth-service:8081
      - LEAVE_SERVICE_URL=http://leave-service:8082
    depends_on:
      auth-service:
        condition: service_healthy
      leave-service:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - leave-network

  frontend:
    build: ./frontend
    image: leave-system/frontend:1.0.0
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - leave-network

networks:
  leave-network:
    driver: bridge

volumes:
  logs:
