server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-admin
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/admin/**
          filters:
            - name: AuthenticationFilter
            - name: LoggingFilter

        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/**
          filters:
            - name: LoggingFilter

        - id: leave-service
          uri: ${LEAVE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/leave/**
          filters:
            - name: AuthenticationFilter
            - name: LoggingFilter

jwt:
  secret: ${JWT_SECRET:U2VjdXJlTGVhdmVNYW5hZ2VtZW50MjAyNCFTZWNyZXRLZXlATldV}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    za.co.leavesystem: DEBUG
    org.springframework.cloud.gateway: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/api-gateway.log
